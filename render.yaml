services:
  # FastAPI Backend Service
  - type: web
    name: resumecraft-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LLM_TIMEOUT_SECONDS
        value: 45
      - key: MAX_FILE_SIZE_MB
        value: 5
      - key: CORS_ORIGINS
        value: https://resumecraft-frontend.vercel.app,http://localhost:3000
      - key: GEMINI_API_KEY
        sync: false
